<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MicroVM Maker</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-readonly="{{ '1' if readonly else '0' }}">
<div class="shell">
  <nav class="side" id="side" aria-label="Main">
    <button class="ws" data-act="host-info" title="Host details">
      <span class="wsmark"><svg class="i" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9.5 4.5 4.5 0 0 1 17.5 18H7Z"/></svg></span>
      <span class="wstxt"><b>MicroVM Maker</b><small id="wshost">Firecracker · v{{ version }}</small></span>
      <svg class="i" viewBox="0 0 24 24"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg>
    </button>
    <button class="nav" data-act="palette"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search<kbd>Ctrl K</kbd></button>
    <button class="nav" data-act="notifs"><svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>Notifications<span class="n" id="n-notif">0</span></button>
    <div class="sep"></div>
    <a class="nav" href="#/overview" data-nav="overview"><svg class="i" viewBox="0 0 24 24"><path d="M12 14l4-4"/><path d="M3.3 17a9 9 0 1 1 17.4 0"/></svg>Overview</a>
    <a class="nav" href="#/vms" data-nav="vms"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></svg>MicroVMs<span class="n" id="n-vms">0</span></a>
    <a class="nav" href="#/replicas" data-nav="replicas"><svg class="i" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>Replicas<span class="n" id="n-rs">0</span></a>
    <details class="grp" open>
      <summary>Build<svg class="i chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></summary>
      <a class="nav" href="#/images" data-nav="images"><svg class="i" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>Images<span class="n" id="n-images">0</span></a>
      <a class="nav" href="#/build" data-nav="build"><svg class="i" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4 2.5-2.5Z"/></svg>Build image</a>
      <a class="nav" href="#/sources" data-nav="sources"><svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="9" r="2"/><path d="M6 7v10M18 11c0 4-6 3-12 6"/></svg>GitHub builds</a>
    </details>
    <details class="grp" open>
      <summary>Platform<svg class="i chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></summary>
      <a class="nav" href="#/activity" data-nav="activity"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity</a>
      <a class="nav" href="#/help" data-nav="help"><svg class="i" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5Z"/><path d="M19 19v2H6"/></svg>What you can do</a>
    </details>
    <div class="sp"></div>
    <div class="foot small faint" id="jobline" style="padding:0 10px"></div>
    <div class="user"><span class="avatar">OP</span><span class="who"><b>Operator</b><small>signed in with token</small></span>
      <button class="ghost" data-act="theme" title="Toggle light/dark"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button class="ghost" data-act="logout" title="Sign out"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button></div>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<div id="modal"></div>
<script src="/static/app.js"></script>
</body>
</html>
