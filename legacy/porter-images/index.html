<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porter Image Catalog</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #12161f; --border: #232a38; --text: #e6e9f0;
    --muted: #8b93a7; --accent: #4f8cff; --green: #3fb96f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 2rem 1.5rem 1rem; max-width: 1100px; margin: 0 auto; }
  header h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
  header p { margin: 0; color: var(--muted); }
  .controls { max-width: 1100px; margin: 1rem auto; padding: 0 1.5rem; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  #search { flex: 1 1 220px; padding: .55rem .8rem; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  .chip { padding: .35rem .75rem; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); cursor: pointer; font-size: .85rem; }
  .chip.active { border-color: var(--accent); color: var(--text); background: #16223a; }
  main { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem 3rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 1rem; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .55rem; cursor: pointer; transition: border-color .15s; }
  .card:hover { border-color: var(--accent); }
  .card h2 { margin: 0; font-size: 1.05rem; display: flex; justify-content: space-between; align-items: center; }
  .status { font-size: .7rem; padding: .15rem .5rem; border-radius: 999px; text-transform: uppercase; letter-spacing: .05em; }
  .status.stable { background: #12331f; color: var(--green); }
  .status.beta { background: #3a2c10; color: #e0a83f; }
  .status.deprecated { background: #3a1212; color: #e05f5f; }
  .card .src { color: var(--muted); font-size: .85rem; font-family: ui-monospace, monospace; }
  .card .desc { color: var(--muted); font-size: .88rem; margin: 0; }
  .meta { display: flex; gap: 1rem; font-size: .82rem; color: var(--muted); flex-wrap: wrap; }
  .meta b { color: var(--text); font-weight: 600; }
  details { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.2rem; max-width: 1100px; margin: 0 auto 3rem; }
  details[open] { max-width: 1100px; }
  summary { cursor: pointer; font-weight: 600; }
  pre { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: .8rem; overflow-x: auto; font-size: .85rem; }
  .error { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 3rem 0; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  td { padding: .3rem .5rem; border-top: 1px solid var(--border); }
  td:first-child { color: var(--muted); width: 140px; }
</style>
</head>
<body>
<header>
  <h1>Porter Image Catalog</h1>
  <p>MicroVM-native images for <a href="https://github.com/vmforge/porter" style="color:var(--accent)">Porter</a> — Docker-first sources, Firecracker runtime.</p>
</header>

<div class="controls">
  <input id="search" type="search" placeholder="Search images…" autocomplete="off">
</div>
<div class="controls" id="types"></div>
<div class="controls" id="cats"></div>

<main id="grid"></main>

<details id="detail" hidden>
  <summary id="detail-title"></summary>
  <table id="detail-table"></table>
  <p style="color:var(--muted);font-size:.85rem;margin-bottom:0">Copy the install command, or download the build manifest after the image is published.</p>
</details>

<script>
const state = { q: "", cat: "all", type: "all" };
let entries = [];

const CATEGORIES = ["all", "base", "web", "database", "cache", "messaging", "search", "storage", "security", "devtools", "observability", "ai", "networking", "selfhosted", "other"];
const TYPES = [["all", "All"], ["base", "Base OS"], ["application", "Application"]];

function renderChips() {
  document.getElementById("types").innerHTML = TYPES.map(([v, l]) =>
    `<button class="chip ${v === state.type ? "active" : ""}" data-type="${v}">${l}</button>`).join("");
  document.getElementById("cats").innerHTML = CATEGORIES.map(c =>
    `<button class="chip ${c === state.cat ? "active" : ""}" data-cat="${c}">${c}</button>`).join("");
  document.querySelectorAll("[data-cat]").forEach(b =>
    b.onclick = () => { state.cat = b.dataset.cat; renderChips(); render(); });
  document.querySelectorAll("[data-type]").forEach(b =>
    b.onclick = () => { state.type = b.dataset.type; renderChips(); render(); });
}

function render() {
  const q = state.q.toLowerCase();
  const list = entries.filter(e =>
    (state.cat === "all" || e.category === state.cat) &&
    (state.type === "all" || (state.type === "base" ? e.type === "base" : e.type !== "base")) &&
    (!q || (e.title + e.name + e.description + e.source).toLowerCase().includes(q)));
  const grid = document.getElementById("grid");
  if (!list.length) { grid.innerHTML = `<div class="error">No images match.</div>`; return; }
  grid.innerHTML = list.map((e, i) => {
    const idx = entries.indexOf(e);
    const r = e.resources || {};
    const isBase = e.type === "base";
    return `<div class="card" data-i="${idx}">
      <h2>${e.title} <span class="status ${e.status}">${e.status}</span></h2>
      <div class="src">${e.source}</div>
      <p class="desc">${e.description || ""}</p>
      <div class="meta">
        ${isBase
          ? `<span>Type <b>Base OS</b></span><span>Arch <b>${(e.arch || []).join(", ")}</b></span>`
          : `<span>CPU <b>${r.cpu ?? "–"}</b></span>
        <span>RAM <b>${r.ramMb ? r.ramMb + " MB" : "–"}</b></span>
        <span>Disk <b>${r.diskGb ? r.diskGb + " GB" : "–"}</b></span>
        <span>Ports <b>${(e.ports || []).join(", ") || "–"}</b></span>`}
      </div>
    </div>`;
  }).join("");
  grid.querySelectorAll(".card").forEach(c =>
    c.onclick = () => showDetail(entries[+c.dataset.i]));
}

function showDetail(e) {
  const r = e.resources || {};
  const rows = [
    ["Source", e.source],
    ["Type", e.type === "base" ? "Base OS" : "Application"],
    ["Architectures", (e.arch || []).join(", ") || null],
    ["Porter tag", `${e.name}:${e.tag}`], ["Base", e.base],
    ["CPU", r.cpu], ["RAM", r.ramMb ? r.ramMb + " MB" : null],
    ["Disk", r.diskGb ? r.diskGb + " GB" : null],
    ["Ports", (e.ports || []).join(", ") || null],
    ["Volumes", (e.volumes || []).join(", ") || null],
    ["Health check", e.health],
  ].filter(x => x[1] != null && x[1] !== "");
  document.getElementById("detail-title").textContent = e.title;
  document.getElementById("detail-table").innerHTML =
    rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("") +
    `<tr><td>Install</td><td><pre style="margin:.2rem 0">porter image install ${e.name}:${e.tag}</pre></td></tr>`;
  const d = document.getElementById("detail");
  d.hidden = false;
  d.scrollIntoView({ behavior: "smooth" });
}

document.getElementById("search").oninput = ev => { state.q = ev.target.value; render(); };

fetch("./catalog.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(c => { entries = c.images; renderChips(); render(); })
  .catch(() => { document.getElementById("grid").innerHTML =
    `<div class="error">Failed to load catalog.json — run converters/validate-image/validate.py.</div>`; });
</script>
</body>
</html>
