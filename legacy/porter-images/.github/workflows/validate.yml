name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Validate image definitions and rebuild catalog
        run: |
          python converters/validate-image/validate.py
          git diff --exit-code catalog.json || {
            echo "::error::catalog.json is out of date — run validate.py and commit"
            exit 1
          }
  build-images:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [nginx, redis, caddy]
    steps:
      - uses: actions/checkout@v4
      - name: Convert ${{ matrix.image }} (prototype)
        run: |
          sudo apt-get update && sudo apt-get install -y e2fsprogs skopeo
          python converters/docker-to-rootfs/convert.py \
            "$(python -c "import json;print(json.load(open('images/${{ matrix.image }}/image.json'))['source']['reference'])"):$(python -c "import json;print(json.load(open('images/${{ matrix.image }}/image.json'))['versions'][0]['tag'])")" \
            -o /tmp/rootfs
          echo "Prototype unpack OK — rootfs packing and Firecracker boot test land in build-images.yml v2"
