<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Porter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚓</text></svg>">
<style>
:root{--bg:#fafafa;--pn:#fff;--hv:#f3f3f5;--bd:#e7e7ea;--tx:#111114;--mu:#6c6c78;--ac:#0070f3;--ok:#16a34a;--wa:#d97706;--er:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0d;--pn:#121215;--hv:#1a1a1e;--bd:#25252b;--tx:#ececf0;--mu:#8a8a96;--ac:#8b85ff;--ok:#3ccf7b;--wa:#e5b02e;--er:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--pn:#0a0a0a;--hv:#171717;--bd:#262626;--tx:#ededed;--mu:#a1a1a1;--ac:#3291ff;--ok:#3ccf7b;--wa:#e5b02e;--er:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex}
button,input,select{font:inherit;color:inherit}
aside{width:200px;flex:none;border-right:1px solid var(--bd);padding:16px 10px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.logo{font-weight:700;font-size:16px;padding:2px 10px 14px}
aside a{padding:7px 10px;border-radius:6px;color:var(--mu);text-decoration:none;cursor:pointer}
aside a:hover{background:var(--hv);color:var(--tx)}aside a.on{background:var(--hv);color:var(--tx);font-weight:600}
.sp{flex:1}
.cl{margin:0 4px 12px;width:calc(100% - 8px)}aside{overflow:auto}#nv{display:flex;flex-direction:column;gap:2px}aside h6{margin:16px 10px 4px;font-size:11px;font-weight:600;color:var(--mu);letter-spacing:.05em;text-transform:uppercase}aside a .i{display:inline-block;width:22px;opacity:.65}aside a.on .i{opacity:1}
#crumb{display:flex;align-items:center;gap:8px;padding:10px 24px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5;color:var(--mu)}#crumb a{cursor:pointer}#crumb a:hover{color:var(--tx)}#crumb b{color:var(--tx);font-weight:600}
main{flex:1;min-width:0;overflow:auto}
.wrap{max-width:960px;margin:0 auto;padding:28px 24px 64px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.top h1{font-size:20px;margin:0;flex:1;font-weight:650}
.btn{border:1px solid var(--bd);background:var(--pn);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--hv)}.btn.p{background:var(--tx);color:var(--bg);border-color:var(--tx)}.btn.d{color:var(--er)}
.k{font:11px ui-monospace,Menlo,monospace;color:var(--mu);border:1px solid var(--bd);border-radius:4px;padding:1px 5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:28px}
.stats div{background:var(--pn);padding:14px 16px}.stats b{display:block;font-size:22px;font-weight:650}.stats span,.mu{color:var(--mu)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:28px 0 8px;font-weight:600}
.list{background:var(--pn);border:1px solid var(--bd);border-radius:8px}
.row{display:grid;grid-template-columns:1.6fr .8fr .7fr .8fr .8fr;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--bd);cursor:pointer}
.row:first-child{border-top:0}.row:hover{background:var(--hv)}.row.h{cursor:default;color:var(--mu);font-size:12px;padding:8px 16px}.row.h:hover{background:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:currentColor}
.ok{color:var(--ok)}.wa{color:var(--wa)}.er{color:var(--er)}.mu2{color:var(--mu)}
.row .n{color:var(--tx);font-weight:600}.row small{display:block;color:var(--mu);font-weight:400}
.alert{display:flex;gap:10px;align-items:center;padding:10px 14px;border:1px solid var(--bd);border-left:3px solid var(--wa);background:var(--pn);border-radius:6px;margin-bottom:8px;cursor:pointer}
.alert.er{border-left-color:var(--er)}.alert span{flex:1}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--bd);margin:0 0 22px}
.tabs a{padding:8px 0;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--tx);border-color:var(--tx);font-weight:600}
.sec{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:16px;margin-bottom:14px}
.sec h3{margin:0 0 4px;font-size:14px}.sec p{margin:0 0 12px;color:var(--mu)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px}.kv>:nth-child(odd){color:var(--mu)}
.bar{height:6px;border-radius:3px;background:var(--hv);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mono,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
pre{background:var(--hv);border-radius:6px;padding:12px;margin:0;overflow:auto;max-height:280px;white-space:pre-wrap}
.step{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:6px;overflow:hidden}.step button{border:0;background:var(--pn);padding:4px 12px;cursor:pointer}.step b{padding:0 14px}
input,select{background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}
.back{color:var(--mu);cursor:pointer;margin-bottom:8px;display:inline-block}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden}.seg button{border:0;background:var(--pn);padding:5px 12px;cursor:pointer}.seg .on{background:var(--tx);color:var(--bg)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:9}
#ov.on{display:flex}#box{background:var(--pn);border:1px solid var(--bd);border-radius:10px;width:min(520px,92%);padding:14px;max-height:70vh;overflow:auto}
#box input{width:100%;margin-bottom:8px}.opt{padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between}.opt:hover,.opt.on{background:var(--hv)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:6px;display:none;z-index:10}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--bd);padding:8px;align-items:center}.logo{padding:0 8px}.sp{display:none}aside h6,.cl{display:none}#nv{flex-direction:row}aside a{white-space:nowrap}.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1.4fr 1fr 1fr}.row>:nth-child(n+4){display:none}.grid3{grid-template-columns:1fr}.wrap{padding:20px 14px 60px}}
</style>
</head>
<body>
<aside>
  <div class="logo">⚓ Porter</div><select class="cl"><option>production · 3 nodes</option><option>staging · 1 node</option></select>
  <div id="nv"></div>
  <div class="sp"></div>
  <a id="pal">Search <span class="k">⌘K</span></a><a id="th">Toggle theme</a>
</aside>
<main><div id="crumb"></div><div class="wrap" id="v"></div></main>
<div id="ov"><div id="box"><input id="q" placeholder="Jump to a workload, node or page…"><div id="opts"></div></div></div>
<div id="toast"></div>
<script>
const W=[
{n:'api',s:'ok',r:[3,3],v:'v31',cpu:64,mem:412,node:'node-2',dom:'api.example.com',rps:312,p95:118,err:.4},
{n:'web-frontend',s:'ok',r:[2,2],v:'v14',cpu:21,mem:184,node:'node-1',dom:'shop.example.com',rps:190,p95:64,err:.1},
{n:'worker',s:'wa',r:[1,2],v:'v31',cpu:38,mem:256,node:'node-2',dom:'-',rps:0,p95:0,err:1.2,why:'1 of 2 replicas failed health checks; replacement is scheduling'},
{n:'docs-preview-482',s:'mu',r:[0,1],v:'pr-482',cpu:0,mem:0,node:'node-1',dom:'482.docs.example.com',rps:0,p95:0,err:0},
{n:'cron-report',s:'er',r:[0,1],v:'v3',cpu:0,mem:0,node:'node-1',dom:'-',rps:0,p95:0,err:100,why:'Crash loop, next retry in 120s'}];
const N=[{n:'node-1',cpu:46,mem:62,disk:38,vm:7,st:'ready'},{n:'node-2',cpu:71,mem:54,disk:41,vm:5,st:'ready'},{n:'node-3',cpu:12,mem:20,disk:15,vm:0,st:'cordoned'}];
const A=[['2m','Deploy','api v31 promoted'],['9m','Scale','worker 2 → 1 after failed health checks'],['31m','Cordon','node-3'],['1h','Sleep','docs-preview-482 idle for 15 minutes'],['3h','Join','node-3 registered']];
const L={ok:'Running',wa:'Degraded',er:'Failing',mu:'Asleep'};
const $=s=>document.querySelector(s),pill=s=>`<span class="${s}"><i class="dot"></i>${L[s]}</span>`;
const bar=v=>`<div class="bar"><i style="width:${v}%"></i></div>`;
function spark(seed,h=44){let x=seed*7+3;const p=Array.from({length:32},(_,i)=>{x=(x*9301+49297)%233280;return 14+Math.sin(i/4+seed)*8+x/233280*10});return `<svg viewBox="0 0 320 ${h}" width="100%" height="${h}" preserveAspectRatio="none"><polyline points="${p.map((v,i)=>i*10+','+(h-v)).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="1.6"/></svg>`}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2000)}
const rows=a=>`<div class="list"><div class="row h"><span>Name</span><span>Status</span><span>Replicas</span><span>Release</span><span>CPU</span></div>${a.map(w=>`<div class="row" data-go="workload-${w.n}"><span class="n">${w.n}<small>${w.dom}</small></span><span>${pill(w.s)}</span><span>${w.r[0]}/${w.r[1]}</span><span class="mono">${w.v}</span><span>${w.cpu}%</span></div>`).join('')}</div>`;
const hd=(t,b='')=>`<div class="top"><h1>${t}</h1>${b}</div>`;
const newBtn='<button class="btn p" data-new>New workload</button>';
const views={
overview(){const bad=W.filter(w=>w.s=='wa'||w.s=='er'),run=W.reduce((a,w)=>a+w.r[0],0);
return hd('Overview',newBtn)+`<div class="stats"><div><b>${run}</b><span>microVMs running</span></div><div><b>${N.length}</b><span>nodes (1 cordoned)</span></div><div><b>312/s</b><span>requests</span></div><div><b>118 ms</b><span>p95 latency</span></div></div>
<h2>${bad.length?'Needs attention':'Status'}</h2>${bad.length?bad.map(w=>`<div class="alert ${w.s}" data-go="workload-${w.n}"><b>${w.n}</b><span>${w.why}</span><span class="mu" style="flex:none">View →</span></div>`).join(''):'<div class="mu">Everything is healthy.</div>'}
<h2>All workloads</h2>${rows(W)}<h2>Reconciler</h2><div class="list">${W.map(w=>{const ok=w.r[0]==w.r[1];return `<div class="row" style="grid-template-columns:1.4fr 1fr 1fr 2fr" data-go="workload-${w.n}"><span class="mono">${w.n}</span><span>wants ${w.r[1]}</span><span>has ${w.r[0]}</span><span class="${ok?'ok':w.s=='mu'?'mu2':w.s=='er'?'er':'wa'}">${ok?'In sync':w.s=='mu'?'Asleep, wakes on request':w.s=='er'?'Backing off 120s':'Scheduling replacement on node-2'}</span></div>`}).join('')}</div><div class="mu" style="margin-top:8px">Last reconcile loop 2s ago. Scheduler picks the least-loaded ready node that fits.</div>`},
workloads(){return hd('Projects',newBtn)+`<input id="f" placeholder="Filter…" style="width:100%;margin-bottom:12px"><div id="fl">${rows(W)}</div>`},
fleet(){return hd('Fleet','<button class="btn" data-t="Join token copied (mock)">Add node</button>')+`<div class="list">${N.map(n=>`<div class="row" style="grid-template-columns:1fr 1fr 1fr 1fr auto" data-go="node-${n.n}"><span class="n">${n.n}<small>${n.st} · ${n.vm} microVMs</small></span><span>CPU ${n.cpu}%${bar(n.cpu)}</span><span>RAM ${n.mem}%${bar(n.mem)}</span><span>Disk ${n.disk}%${bar(n.disk)}</span><button class="btn" data-t="${n.st=='ready'?'Cordoned':'Uncordoned'} ${n.n}">${n.st=='ready'?'Cordon':'Uncordon'}</button></div>`).join('')}</div>`},
observe(){return hd('Observe')+`<div class="grid3">${[['Requests / s','312',1],['p95 latency','118 ms',2],['Error rate','0.4%',3]].map(c=>`<div class="sec"><div class="mu">${c[0]}</div><b style="font-size:22px">${c[1]}</b>${spark(c[2])}</div>`).join('')}</div><h2>Recent slow or failed requests</h2><div class="list">${[['GET /api/report','1.2 s','500'],['POST /api/cart','31 ms','201'],['GET /api/items','14 ms','200']].map(t=>`<div class="row" style="grid-template-columns:2fr 1fr 1fr"><span class="mono">${t[0]}</span><span>${t[1]}</span><span class="${t[2]=='500'?'er':'ok'}"><i class="dot"></i>${t[2]}</span></div>`).join('')}</div>`},
activity(){return hd('Activity')+`<div class="list">${A.map(a=>`<div class="row" style="grid-template-columns:80px 90px 1fr"><span class="mu">${a[0]} ago</span><b>${a[1]}</b><span>${a[2]}</span></div>`).join('')}</div>`}};
views.gateway=()=>hd('Gateway','<button class="btn" data-t="Add domain (mock)">Add domain</button>')+`<div class="list"><div class="row h" style="grid-template-columns:2fr 1.4fr 1fr 1fr"><span>Domain</span><span>Backend</span><span>TLS</span><span>Expires</span></div>${[['shop.example.com','web-frontend','Valid','42d'],['api.example.com','api','Valid','42d'],['482.docs.example.com','docs-preview-482','Valid','Preview'],['staging.example.com','none','DNS pending','-']].map(g=>`<div class="row" style="grid-template-columns:2fr 1.4fr 1fr 1fr" data-t="${g[0]}"><span class="mono">${g[0]}</span><span>${g[1]}</span><span class="${g[2]=='Valid'?'ok':'wa'}"><i class="dot"></i>${g[2]}</span><span class="mu">${g[3]}</span></div>`).join('')}</div><h2>Built-in load balancer</h2><div class="sec"><div class="kv"><span>Algorithm</span><span>least-conn (per workload)</span><span>Health checks</span><span>HTTP /healthz every 5s</span><span>Retries</span><span>2, idempotent only</span><span>Wake on request</span><span>On for previews</span></div></div>`;
views.settings=()=>hd('Settings')+`<div class="sec"><h3>Control plane</h3><div class="kv" style="margin-top:10px"><span>Mode</span><span>Host service</span><span>State</span><span class="mono">porter.db</span><span>Agent link</span><span class="ok">Verified HTTPS / WSS</span><span>Unisolated builds</span><span>Disabled</span></div></div><div class="sec"><h3>Access tokens</h3><p>Scoped tokens for CI and automation.</p>${['ci-deploy · deploy only','read-only · metrics'].map(t=>`<div class="row" style="grid-template-columns:1fr auto;padding:8px 0"><span class="mono">${t}</span><button class="btn" data-t="Token revoked (mock)">Revoke</button></div>`).join('')}</div>`;
function nodeP(id){const n=N.find(x=>x.n==id);if(!n)return views.fleet();const i=N.indexOf(n),vms=[];W.forEach(w=>{for(let k=0;k<w.r[1];k++)if(w.node==n.n)vms.push([w.n,k,k<w.r[0]])});
return `<span class="back" data-go="fleet">← Fleet</span>`+hd(n.n+' <span class="mu" style="font-size:13px;font-weight:400">'+n.st+'</span>','<button class="btn" data-t="Cordoned (mock)">Cordon</button><button class="btn" data-t="Draining (mock)">Drain</button>')+`<div class="grid3">${[['CPU',n.cpu],['Memory',n.mem],['Disk',n.disk]].map(c=>`<div class="sec"><div class="mu">${c[0]}</div><b style="font-size:20px">${c[1]}%</b>${bar(c[1])}</div>`).join('')}</div><div class="sec"><h3>Machine</h3><div class="kv" style="margin-top:10px"><span>Host</span><span class="mono">metal-0${i+1} · 10.0.1.1${i+1}</span><span>OS</span><span>Ubuntu 24.04 · kernel 6.8</span><span>CPU</span><span>AMD EPYC · ${i<2?32:16} threads</span><span>RAM / disk</span><span>${i<2?128:64} GB · NVMe</span><span>Firecracker</span><span>1.10 · KVM available</span><span>Uptime</span><span>${i<2?'41d':'2d'}</span><span>Security</span><span class="${i==2?'wa':'ok'}">${i==2?'Patches 31 days old':'Firewall default deny, up to date'}</span></div></div><h2>MicroVMs on this node</h2>${vms.length?`<div class="list">${vms.map(v=>`<div class="row" style="grid-template-columns:2fr 1fr" data-go="replica-${v[0]}-${v[1]}"><span class="mono">${v[0]}-${v[1]}</span><span class="${v[2]?'ok':'er'}"><i class="dot"></i>${v[2]?'Running':'Not running'}</span></div>`).join('')}</div>`:'<div class="mu">Nothing scheduled here.</div>'}`}
function repP(s,tab){const x=s.lastIndexOf('-'),w=W.find(q=>q.n==s.slice(0,x)),i=+s.slice(x+1);if(!w)return views.workloads();tab=tab||'overview';
const up=i<w.r[0],pr=i==0,rps=up?48+i*9+w.n.length:0,ip='172.16.10.'+(10+i+w.n.length),cpu=up?30+i*8:0,mem=up?40+i*6:0,T=['overview','traffic','metrics','logs','console','storage','network','env','lifecycle','doctor'];
const card=(a,v,k)=>`<div class="sec"><div class="mu">${a}</div><b style="font-size:20px">${v}</b>${k!=null?spark(k):''}</div>`;let b='';
if(tab=='overview')b=`<div class="sec"><div class="kv"><span>State</span><span class="${up?'ok':'er'}">${up?'Running':'Not running'} · boot 14.8 ms</span><span>Node</span><span><a style="cursor:pointer;text-decoration:underline" data-go="node-${w.node}">${w.node}</a></span><span>IP</span><span class="mono">${ip}</span><span>Spec</span><span>1 vCPU · 256 MB</span><span>Deployment</span><span class="mono">${w.v}</span><span>Uptime</span><span>${up?(i+1)*3+'h':'-'}</span><span>Cost</span><span>$0.042/h · about $30/month</span></div></div><h2>Replica group</h2><div class="list">${Array.from({length:w.r[1]},(_,k)=>`<div class="row" style="grid-template-columns:1.4fr 1fr 1fr" data-go="replica-${w.n}-${k}"><span class="mono">${w.n}-${k}${k==0?' <span class="k">primary</span>':''}${k==i?' <span class="k">this</span>':''}</span><span class="${k<w.r[0]?'ok':'er'}"><i class="dot"></i>${k<w.r[0]?'Running':'Not running'}</span><span class="mu">${w.node}</span></div>`).join('')}</div><h2>Recent activity</h2><div class="list">${[['Health check passed','2m ago'],['Restarted (ACPI)','3h ago'],['Booted from '+w.v,'1d ago']].map(a=>`<div class="row" style="grid-template-columns:1fr auto"><span>${a[0]}</span><span class="mu">${a[1]}</span></div>`).join('')}</div>`;
if(tab=='traffic')b=`<div class="grid3">${card('Requests / s',rps,1+i)}${card('p50 / p99',up?'0.4 / 2.3 ms':'-',2+i)}${card('Rx / Tx',up?(rps*.007).toFixed(1)+' / '+(rps*.019).toFixed(1)+' MB/s':'-',3+i)}</div><div class="sec"><div class="kv"><span>Share of workload</span><span>${up?Math.round(100/w.r[0])+'%':'0%'}</span><span>Active connections</span><span>${up?12+i*7:0}</span><span>Dropped</span><span>0</span><span>5xx</span><span>${up?'0.0%':'-'}</span></div></div>`;
if(tab=='metrics')b=`<div class="grid3">${card('CPU',cpu+'%',4+i)}${card('Memory',up?Math.round(mem*2.56)+' / 256 MB':'-',5+i)}${card('Block I/O',up?'1.7 MB/s':'-',6+i)}</div><div class="sec">CPU${bar(cpu)}<div style="height:10px"></div>Memory (ballooning on)${bar(mem)}<div class="mu" style="margin-top:10px">IOPS read 480, write 1200 · load 0.4 / 0.3 / 0.3</div></div>`;
if(tab=='logs')b='<pre id="log">Waiting for logs…\n</pre><div class="mu" style="margin-top:8px">Serial and app output for this replica only (simulated)</div>';
if(tab=='console')b=`<pre>serial ttyS0 (read-only)\n[0.014] porter guest agent ready\n[0.021] app listening on :8080</pre><div class="mu" style="margin-top:8px">Interactive shell arrives with the guest agent. Input is disabled for now.</div>`;

$('#pal').onclick=pal;$('#ov').onclick=e=>{if(e.target.id=='ov')$('#ov').classList.remove('on')};
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()=='k'){e.preventDefault();pal()}if(e.key=='Escape')$('#ov').classList.remove('on');if(!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&!e.metaKey&&!e.ctrlKey){if(e.key=='/'){e.preventDefault();pal()}if(e.key=='c'&&!$('#ov').classList.contains('on'))modal()}});
$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
addEventListener('hashchange',route);route();
</script>
